services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:13
    container_name: unifocus_postgres
    environment:
      POSTGRES_USER: unifocus
      POSTGRES_PASSWORD: unifocus_dev_password
      POSTGRES_DB: unifocus_dev
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init_all.sql:/docker-entrypoint-initdb.d/init_all.sql
    networks:
      - unifocus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifocus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:6
    container_name: unifocus_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unifocus_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Go 后端 API 服务
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: unifocus_api
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: unifocus
      DB_PASSWORD: unifocus_dev_password
      DB_NAME: unifocus_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: docker-dev-secret-key-minimum-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SEED_COMPETITIONS_ON_START: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unifocus_network
    command: go run cmd/api/main.go

networks:
  unifocus_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  go_modules:
